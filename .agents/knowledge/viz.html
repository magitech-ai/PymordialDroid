const NODES=[{"id": "pymordialdroid/architecture", "type": "Architecture Guide", "title": "PymordialDroid \u2014 Automation Architecture & System Overview", "description": "High-level host architecture, bundled binary resolution, wireless ADB networking, and Pymordial contract implementations.", "tags": ["android", "architecture", "adb", "scrcpy", "networking", "pymordial"], "group": "pymordialdroid", "sz": 58, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "superseded_by": "", "superseded_cid": null, "sources": [{"title": "Genymobile scrcpy", "resource": "https://github.com/Genymobile/scrcpy", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "Android Debug Bridge (ADB)", "resource": "https://developer.android.com/tools/adb", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Automation Architecture & System Overview\n\n> [!NOTE]\n> This guide documents the host-side infrastructure, wireless ADB networking, process orchestration, and Pymordial contract implementation. For configuration files and layouts, see [Configuration Reference](./configuration.md). For video streaming, see [Display Streaming](./display_streaming.md). For low-level input, see [Touch Injection](./touch_injection.md). For recorded fieldwork gaps, see [Issues Tracker](./issues.md).\n\n---\n\n## 1. Automation Architecture\n\n```mermaid\ngraph LR\n    subgraph Host[\"PC / Steam Deck (Windows 11)\"]\n        Commander[\"PymordialDroid (FleetCommander TUI)\"]\n        Scrcpy[\"scrcpy 4.1 (Direct3D 11 Renderer)\"]\n        ADBClient[\"adb.exe (Bundled inside bin/scrcpy)\"]\n    end\n    subgraph Transport[\"Local Wi-Fi / USB Network\"]\n        TCP[\"TCP/IP Socket :5555\"]\n    end\n    subgraph Device[\"Physical Android Device (Galaxy S24 Ultra)\"]\n        ADBD[\"adbd (Android Native Daemon)\"]\n        App[\"Target Android Application\"]\n    end\n\n    Commander -->|Async Python commands| TCP\n    Scrcpy -->|60 FPS H.264 video feed| TCP\n    ADBClient -->|Process orchestration| TCP\n    TCP --> ADBD\n    ADBD --> App\n```\n\n---\n\n## 2. Bundled Binaries & Path Resolution\n\nThe automation suite bundles `scrcpy` and `adb` inside `src/pymordialdroid/bin/scrcpy/`:\n\n* **ADB Executable**: `src/pymordialdroid/bin/scrcpy/adb.exe` (Version 36.0.0-13206524 / 1.0.41)\n* **Scrcpy Executable**: `src/pymordialdroid/bin/scrcpy/scrcpy.exe` (Version 4.1 / SDL 3.4.12)\n* **Scrcpy Server**: `src/pymordialdroid/bin/scrcpy/scrcpy-server` (Version 4.1)\n\nBoth binaries are dynamically resolved in `FleetCommander.__init__`:\n```python\nbase_dir = Path(__file__).resolve().parent\nadb_exe = \"adb.exe\" if sys.platform == \"win32\" else \"adb\"\nscrcpy_exe = \"scrcpy.exe\" if sys.platform == \"win32\" else \"scrcpy\"\n\nself.config = SystemConfig(\n    adb_bin_path=base_dir / \"bin\" / \"scrcpy\" / adb_exe,\n    scrcpy_bin_path=base_dir / \"bin\" / \"scrcpy\" / scrcpy_exe,\n)\n```\n\n---\n\n## 3. Wireless ADB Pairing & Persistent Port Configuration\n\n### 3.1 Initial Wireless Pairing (TLS)\nOn Android 11+, Google uses TLS for the initial Wireless Debugging handshake:\n1. From the device's \"Pair device with pairing code\" menu:\n   ```bash\n   adb pair \u003cIP>:\u003cPAIRING_PORT> \u003c6_DIGIT_PIN>\n   ```\n2. Keys are authenticated and persisted in `~/.android/adbkey` and `~/.android/adb_known_hosts.pb`.\n\n### 3.2 Persistent Port 5555 Transition\nDynamic wireless debugging ports change on every reboot or Wi-Fi reconnect, and use `STLS` handshakes which pure-Python `adb_shell` cannot negotiate. To make connections permanent and compatible with all Python drivers:\n```bash\nadb connect \u003cIP>:\u003cDYNAMIC_PORT>\nadb -s \u003cIP>:\u003cDYNAMIC_PORT> tcpip 5555\nadb connect \u003cIP>:5555\n```\nThis restarts the Android system ADB daemon on port **5555** with standard RSA token authentication.\n\n---\n\n## 4. TUI & Fleet Management\n\nRun PymordialDroid using `uv`:\n```bash\ncd /d D:\\projects\\PymordialDroid\nuv run pymordialdroid\n```\nOr run as a module:\n```bash\nuv run python -m pymordialdroid\n```\n\n### Features Matrix\n* **[1] Add Devices**: Performs synchronous USB scans or subnet sweeps to auto-discover phones, run `tcpip 5555`, and extract IP addresses via `ip route`.\n* **[2] Launch Viewer(s)**: Spawns `scrcpy.exe` with grid layout positioning, `--no-audio`, and optional `--turn-screen-off` (ghost mode to save battery).\n* **[3] Organize Windows**: Uses Win32 API (`user32.MoveWindow`) to auto-tile active viewers across multiple displays.\n* **[4] Kill All Viewers**: Gracefully terminates running `scrcpy.exe` processes.\n* **[5] Install APK**: Pushes APK updates in parallel across all fleet devices.\n* **[6] Device Details**: Inspects real-time battery percentages, response latency, and connection states.\n* **[7] Restore Layout**: Reopens scrcpy viewers from saved layout session.\n\n---\n\n## 5. Pymordial Contract Implementation\n\nPymordialDroid implements the core abstract interfaces defined by `Pymordial` (`D:\\projects\\Pymordial`), providing full interoperability with Pymordial's plugin and app state machine system.\n\n```mermaid\nclassDiagram\n    class PymordialController {\n        \u003c\u003cabstract>>\n        +connect()\n        +disconnect()\n        +bridge: PymordialBridgeDevice\n        +vision: PymordialVisionDevice\n    }\n    class PymordialDroidController {\n        +adb: PymordialAdbDevice\n        +ui: PymordialDroidUiDevice\n        +scrcpy: PymordialScrcpyDevice\n    }\n    class PymordialBridgeDevice {\n        \u003c\u003cabstract>>\n        +execute_shell_command()\n        +tap()\n        +swipe()\n        +key_event()\n    }\n    class PymordialAdbDevice {\n        +connect_adb()\n        +find_package_by_keyword()\n        +get_focused_app()\n    }\n    class PymordialVisionDevice {\n        \u003c\u003cabstract>>\n        +find_image()\n        +click_image()\n        +get_pixel_color()\n    }\n    class PymordialDroidUiDevice {\n        +find_image()\n        +click_image()\n        +get_pixel_color()\n    }\n    class PymordialApp {\n        \u003c\u003cabstract>>\n        +name: str\n        +state: AppState\n        +launch()\n        +stop()\n    }\n    class PymordialAndroidApp {\n        +package_name: str\n        +launch_activity: Optional[str]\n    }\n\n    PymordialController \u003c|-- PymordialDroidController\n    PymordialBridgeDevice \u003c|-- PymordialAdbDevice\n    PymordialVisionDevice \u003c|-- PymordialDroidUiDevice\n    PymordialApp \u003c|-- PymordialAndroidApp\n    PymordialDroidController *-- PymordialAdbDevice\n    PymordialDroidController *-- PymordialDroidUiDevice\n    PymordialDroidController *-- PymordialScrcpyDevice\n```\n\n### Core Classes & Roles\n1. **`PymordialAdbDevice` (`pymordialdroid.devices.adb_device`)**:\n   - Implements `PymordialBridgeDevice`.\n   - Supports pure-Python `adb_shell` over wireless port 5555 with automatic RSA key generation (`~/.android/adbkey`), falling back to CLI `adb.exe` if needed.\n   - Provides Android package discovery (`find_package_by_keyword`), launch activity resolution (`get_launch_activity`), and focused window detection (`get_focused_app`).\n2. **`PymordialDroidUiDevice` (`pymordialdroid.devices.ui_device`)**:\n   - Implements `PymordialVisionDevice`.\n   - Uses OpenCV template matching (`matchTemplate` with `TM_CCOEFF_NORMED`) for `PymordialImage` queries.\n   - Takes screenshots on-demand via ADB bridge (`screencap -p`).\n3. **`PymordialScrcpyDevice` (`pymordialdroid.devices.scrcpy_device`)**:\n   - Implements `PymordialDisplayDevice`.\n   - Manages background and foreground `scrcpy` subprocess instances.\n4. **`PymordialDroidController` (`pymordialdroid.droid_controller`)**:\n   - Implements `PymordialController`.\n   - Dynamically resolves and mounts bridge (`adb`), vision (`ui`), and display (`scrcpy`) devices.\n5. **`PymordialAndroidApp` (`pymordialdroid.android_app`)**:\n   - Extends `PymordialApp`.\n   - Manages app lifecycle (`launch`, `stop`, `restart`, `uninstall`) and state transitions."}, {"id": "pymordialdroid/configuration", "type": "Configuration Reference", "title": "PymordialDroid \u2014 Configuration & State Management", "description": "Directory locations, JSON schemas, PIN resolution rules, and window layout persistence in ~/.pymordialdroid/.", "tags": ["configuration", "json", "pin-resolution", "fleet-inventory", "persistence"], "group": "pymordialdroid", "sz": 34, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "superseded_by": "", "superseded_cid": null, "sources": [{"title": "PymordialDroid Config Module", "resource": "src/pymordialdroid/config.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Configuration & State Management\n\nAll dynamic runtime data and user configuration are kept out of the source tree and stored in the user directory `~/.pymordialdroid/` (`%USERPROFILE%\\.pymordialdroid` on Windows):\n\n## 1. Global Configuration (`config.json`)\n\nLocated at `~/.pymordialdroid/config.json`:\n\n```json\n{\n    \"default_pin\": \"110516\",\n    \"adb_path\": null,\n    \"scrcpy_path\": null\n}\n```\n\n### PIN Resolution Precedence\nWhen unlocking devices or negotiating pairing codes, PIN is resolved in the following priority:\n1. Per-device `pin` in `fleet_inventory.json` (if specified)\n2. Environment variable `DEVICE_PIN` or `PYMORDIALDROID_PIN`\n3. `default_pin` in `~/.pymordialdroid/config.json`\n4. Hardcoded fallback `\"1234\"`\n\n---\n\n## 2. Fleet Inventory (`fleet_inventory.json`)\n\nLocated at `~/.pymordialdroid/fleet_inventory.json`. Holds records of all discovered or manually registered physical and virtual devices:\n\n```json\n[\n    {\n        \"serial\": \"172.20.8.50:5555\",\n        \"ip\": \"172.20.8.50\",\n        \"port\": 5555,\n        \"name\": \"Galaxy S24 Ultra\",\n        \"pin\": \"110516\"\n    }\n]\n```\n\n### Fields\n* `serial`: Unique ADB serial identifier (`\u003cip>:\u003cport>` for wireless, hardware serial for USB).\n* `ip`: Host IPv4 address.\n* `port`: ADB TCP port (typically `5555`).\n* `name`: Human-readable label displayed in TUI and window titles.\n* `pin`: (Optional) Device-specific screen unlock PIN override.\n\n---\n\n## 3. Viewer Layout Persistence (`viewer_layout.json`)\n\nLocated at `~/.pymordialdroid/viewer_layout.json`.\n\nTracks currently active `scrcpy` viewers across sessions so window arrangements, tile positions, and connected monitors can be restored automatically when restarting Fleet Commander.\n\n```json\n{\n    \"viewers\": [\n        {\n            \"serial\": \"172.20.8.50:5555\",\n            \"x\": 100,\n            \"y\": 100,\n            \"width\": 540,\n            \"height\": 1170,\n            \"title\": \"Galaxy S24 Ultra\"\n        }\n    ]\n}\n```\n\nSee also: [Architecture Guide](./architecture.md) and [Display Streaming](./display_streaming.md)."}, {"id": "pymordialdroid/display_streaming", "type": "Technical Specification", "title": "PymordialDroid \u2014 Display Streaming & Perception Pipeline", "description": "Low-latency scrcpy H.264 video streaming, Direct3D 11 rendering, frame providers, and screencap perception architecture.", "tags": ["scrcpy", "display-streaming", "direct3d11", "h264", "live-stream", "opencv", "perception"], "group": "pymordialdroid", "sz": 40, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "superseded_by": "", "superseded_cid": null, "sources": [{"title": "Genymobile scrcpy 4.1", "resource": "https://github.com/Genymobile/scrcpy", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Display Streaming & Perception Pipeline\n\nPymordialDroid relies on `scrcpy` (version 4.1, SDL 3.4.12) to provide ultra-low-latency real-time video streaming, host window embedding, and real-time computer vision frame pipelines.\n\n---\n\n## 1. Streaming Infrastructure & Renderer\n\n* **Renderer Backend**: Direct3D 11 (`d3d11` on Windows) / OpenGL on Linux.\n* **Encoding**: Device-side hardware-accelerated H.264 via `MediaCodec`.\n* **Framerate & Latency**: Streams typically achieve **44\u201369 FPS** with an end-to-end frame age of **11\u201340 ms** over local Wi-Fi / USB.\n* **Audio**: Muted by default (`--no-audio`) to preserve host bandwidth and reduce audio buffer overhead.\n* **Ghost Mode**: Supports `--turn-screen-off` to stream display frames to the host while keeping the physical AMOLED display unpowered to prevent thermal throttling and save battery.\n\n---\n\n## 2. Real-Time Vision Feed vs. Full-Resolution Screencap\n\nReal-time automation requires balancing perception latency with image resolution:\n\n```mermaid\ngraph TD\n    Device[Physical Device Display 2340x1080] -->|MediaCodec H.264 Stream| ScrcpyServer[scrcpy-server 4.1]\n    Device -->|screencap -p| ADBD[adbd]\n    ScrcpyServer -->|TCP socket| HostStream[Live Stream Socket 960x442]\n    ADBD -->|ADB Pipe| Screencap[Full-Res PNG 2340x1080]\n    HostStream -->|Frame Provider| RealtimeVision[Real-Time Servo / Navigation 15-40ms]\n    Screencap -->|Direct Command| StateDetection[OCR / Template Matching / Color Checks 1-2s]\n```\n\n### 2.1 Live Stream Pipeline (`start_live_stream`)\n* Invoked via `controller.start_live_stream(max_size=960, max_fps=30)`.\n* Produces frames at **44\u201369 FPS** with frame ages between **11\u201340 ms**.\n* Ingests into `AndroidController.capture_screen()`, providing sub-100 ms loop latency.\n* **Actual Resolution Note**: While requested with `max_size=960`, the actual frame dimensions are **`960x442`** (not `960x440`), because `scrcpy` rounds downscaled dimensions to even integers. Vision code must read `frame.shape[:2]` dynamically.\n* **Native Resolution Stream (`max_size=0`)**: When executing OpenCV template matching against assets captured at native device resolution (e.g. $2340 \\times 1080$), pass `max_size=0` to preserve physical display resolution without downscale distortion or coordinate drift, while retaining sub-50 ms streaming latency.\n\n### 2.2 Full-Resolution Screencap Pipeline\n* Plain `adb shell screencap -p` captures uncompressed PNG frames at native device resolution (**`2340x1080`** on Galaxy S24 Ultra).\n* Latency: Costs **1.0\u20132.0 seconds** per capture.\n* Suitable for: Static state detection (title screen, loading bars), OCR text recognition, and pixel-exact template matching.\n* Bypass command: `controller.bridge.run_command(\"screencap -p\", decode=False)`.\n\n---\n\n## 3. Coordinate Space Transformation\n\nWhen processing detections between live feed frames and device touch coordinates:\n\n$$\\text{Scale}_X = \\frac{W_{\\text{device}}}{W_{\\text{stream}}} = \\frac{2340}{960} = 2.4375$$\n\n$$\\text{Scale}_Y = \\frac{H_{\\text{device}}}{H_{\\text{stream}}} = \\frac{1080}{442} \\approx 2.4434$$\n\nSee also: [Touch Injection](./touch_injection.md), [Architecture](./architecture.md), and [Issues](./issues.md)."}, {"id": "pymordialdroid/issues", "type": "Issue Tracker", "title": "PymordialDroid \u2014 Bugs, Issues & Fieldwork Findings", "description": "Living log of host-side automation gaps, touch injection resolutions, and perception caveats encountered during fieldwork.", "tags": ["issues", "touch-injection", "motionevent", "scrcpy-control", "selinux", "s24-ultra"], "group": "pymordialdroid", "sz": 41, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "superseded_by": "", "superseded_cid": null, "sources": [{"title": "Samsung Galaxy S24 Ultra Live Verification", "resource": "device:SM-S928U", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Bugs, Issues & Fieldwork Findings\n\nLiving log of host-side automation gaps encountered while testing game automation on physical hardware (Galaxy S24 Ultra, `SM-S928U`, over USB/TCP). Updated 2026-09-16.\n\n---\n\n## 1. Fine Camera Deadzone (HIGH \u2014 Resolved)\n* **Symptom:** Single coarse swipes \u003c600 px in 2340x1080 space produced zero rotation because the game engine gated on minimum swipe velocity/distance.\n* **Resolution (2026-09-16):** Resolved via `precise_drag` on `AdbDevice` which emits dense, interpolated move events (e.g. 24 steps with 16 ms spacing). 200 px drags now register reliably for sub-30\u00b0 camera trims.\n\n---\n\n## 2. Touch Hold & Multi-Touch Injection (HIGH \u2014 Resolved)\n* **Symptom:** Standard ADB `input swipe` always lifts the touch at completion, causing a stop-start stuttering gait during continuous locomotion.\n* **SELinux Denial:** Non-rooted retail Samsung hardware forbids shell UID from writing directly to `/dev/input/event*` (`sendevent` gets `Permission denied`).\n* **Single-Pointer Hold:** Implemented via `MotionEventInjector` (`input motionevent \u003cDOWN|MOVE|UP>`). Allows smooth continuous walking for arbitrary durations on slot 0.\n* **Multi-Touch Resolution:** Resolved via `scrcpy-control` (`ScrcpyControlInjector`, `devices/scrcpy_control.py`). Headless scrcpy server accepts binary multi-touch packets without root or SELinux restrictions, enabling simultaneous dual-thumb gameplay (joystick on slot 0 + camera drag on slot 1).\n\n---\n\n## 3. Built-In Anti-AFK Scheduler (MEDIUM)\n* **Symptom:** Game server disconnects idle players after i oid \u2014 Touch Injection & Multi-Touch Architecture", "description": "Low-level touch injection backends (scrcpy-control, motionevent, sendevent) and Unified Touch API on AdbDevice.", "tags": ["touch-injection", "multitouch", "scrcpy-control", "motionevent", "sendevent", "gesture", "adb"], "group": "pymordialdroid", "sz": 44, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "superseded_by": "", "superseded_cid": null, "sources": [{"title": "Scrcpy Control Client Implementation", "resource": "src/pymordialdroid/devices/scrcpy_control.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "Samsung Galaxy S24 Ultra Android 16 Verification", "resource": "device:SM-S928U", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Touch Injection & Multi-Touch Architecture\n\n`PymordialDroid` provides fine-grained, low-latency touch injection via a multi-tiered backend architecture implemented on `AdbDevice` (`devices/adb_device.py`).\n\n---\n\n## 1. Backend Tier Hierarchy\n\n```mermaid\ngraph TD\n    Request[Touch / Gesture Request] --> Check{Backend Selection}\n    Check -->|Non-root Multi-Touch / Low Latency| ScrcpyCtrl[scrcpy-control Daemon Socket]\n    Check -->|Single-Pointer Android 14+| MotionEvent[input motionevent DOWN / MOVE / UP]\n    Check -->|Root / Permissive SELinux| SendEvent[Linux Kernel /dev/input/event*]\n    Check -->|Fallback| Swipe[Legacy input swipe / tap]\n```\n\n### 1.1 `scrcpy-control` (`ScrcpyControlInjector`, `devices/scrcpy_control.py`)\n* **Capabilities**: True concurrent multi-touch (slots 0\u20139+), $\u003c1\\text{ ms}$ packet latency, 60+ Hz stream fidelity, non-root.\n* **Mechanism**: Runs a headless `scrcpy-server` instance (`video=false audio=false control=true cleanup=false`) via `app_process` as UID 2000 (`shell`). Sends 32-byte binary `INJECT_TOUCH_EVENT` packets over a local TCP tunnel (`adb forward tcp:\u003cport> localabstract:scrcpy_\u003cscid>`).\n* **Binary Packet Format**: Big-endian 32-byte struct:\n  `struct.pack('>BBQiiHHHii', 2, action, pointer_id, x, y, width, height, 0xffff, 0, 0)`\n  where action: `0=DOWN`, `1=UP`, `2=MOVE`.\n* **Server-Side Tracking**: Server's internal `PointersState` automatically synthesizes pointer masks (`ACTION_POINTER_DOWN` / `ACTION_POINTER_UP`), allowing simultaneous two-thumb operation (joystick + camera).\n* **Startup Policy**: Lazy initialization on first slot > 0 request or eager start via `start_multitouch()` / `scrcpy_control=True`. Once running, serves all slots.\n\n### 1.2 `motionevent` (`MotionEventInjector`, `devices/motionevent_injector.py`)\n* **Capabilities**: Low-cost single-pointer touch hold and fine drags on non-rooted Android 14+.\n* **Mechanism**: Executes `adb shell input motionevent \u003cDOWN|MOVE|UP> \u003cx> \u003cy>`.\n* **Limitation**: Strictly single-pointer (AOSP `InputShellCommand` hardcodes `pointerCount = 1`, `pointerId = 0`). Requests for slot > 0 log a warning and return False.\n\n### 1.3 `sendevent` (`TouchInjector`, `devices/touch_injector.py`)\n* **Capabilities**: Direct Linux kernel multi-touch protocol (type-B slots) via `/dev/input/event*`.\n* **Limitation**: Requires root or permissive SELinux; denied by SELinux on retail Samsung hardware (One UI 6.1+).\n\n### 1.4 `input swipe` (Legacy fallback)\n* Coarse fallback for basic taps and long-presses when fine touch injection is completely unavailable.\n\n---\n\n## 2. Unified Touch API (`AdbDevice`)\n\nAll controller touch interactions flow through unified methods:\n\n```python\n# Presses contact down at display pixel coordinates\ndev.touch_down(x, y, slot=0)\n\n# Moves active contact to new pixel coordinates\ndev.touch_move(x, y, slot=0)\n\n# Lifts contact on the given slot\ndev.touch_up(slot=0)\n\n# Releases contact for stuck-gesture recovery\ndev.touch_cancel(slot=0)\n\n# Holds contact down continuously for duration without release\ndev.touch_hold(x, y, duration_ms, slot=0)\n\n# Context manager holding contact down for duration of Python block\nwith dev.held_touch(x, y, slot=0):\n    do_something()\n\n# Emits dense interpolated move stream for fine camera trims and gesture gating\ndev.precise_drag(x1, y1, x2, y2, steps=24, step_delay_ms=16, slot=0)\n\n# Starts the persistent scrcpy-control daemon explicitly\ndev.start_multitouch(timeout=20.0)\n```\n\n---\n\n## 3. Two-Thumb Concurrent Multi-Touch Pattern\n\nExecuting concurrent locomotion and camera rotations without root:\n\n```python\n# Enable scrcpy multi-touch daemon\ndev.start_multitouch()\n\n# Left Thumb (slot 0): Grab joystick knob and push forward\ndev.touch_down(280, 702, slot=0)\ndev.touch_move(280, 550, slot=0)\n\n# Right Thumb (slot 1): Concurrently rotate camera via precise interpolated drag\ndev.precise_drag(1755, 540, 1305, 540, steps=35, step_delay_ms=25, slot=1)\n\n# Release Left Thumb\ndev.touch_up(slot=0)\n```\n\nSee also: [Architecture Guide](./architecture.md), [Display Streaming](./display_streaming.md), and [Configuration Guide](./configuration.md)."}], EDGES=[{"source": "pymordialdroid/architecture", "target": "pymordialdroid/configuration"}, {"source": "pymordialdroid/architecture", "target": "pymordialdroid/display_streaming"}, {"source": "pymordialdroid/architecture", "target": "pymordialdroid/touch_injection"}, {"source": "pymordialdroid/architecture", "target": "pymordialdroid/issues"}, {"source": "pymordialdroid/configuration", "target": "pymordialdroid/architecture"}, {"source": "pymordialdroid/configuration", "target": "pymordialdroid/display_streaming"}, {"source": "pymordialdroid/display_streaming", "target": "pymordialdroid/touch_injection"}, {"source": "pymordialdroid/display_streaming", "target": "pymordialdroid/architecture"}, {"source": "pymordialdroid/display_streaming", "tar
